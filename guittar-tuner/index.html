<h2>Guittar Tuner</h2>

<p><button id="pitch">A = 415</button></p>

<div id="tuner"><div class="notes">
  <!-- Just intonation: ratio to the low C (1, 5/4, 3/2, 2, 5/2, 3) -->
  <button data-ratio="1">C</button>
  <button data-ratio="1.25">E</button>
  <button data-ratio="1.5">G</button>
  <button data-ratio="2">c</button>
  <button data-ratio="2.5">e</button>
  <button data-ratio="3">g</button>
</div></div>

<style>
  /* The theme upper-cases buttons, which would turn c/e/g into C/E/G */
  /* Fixed-width columns: otherwise each button is sized to its letter, and C, c, e, g are different widths.
     Only 1, 2, 3 or 6 columns, so the rows are always even. n columns need 5.25n + 0.75(n - 1) em. */
  #tuner { container-type: inline-size; }
  #tuner .notes { display: grid; gap: 0.75em; grid-template-columns: 5.25em; margin-bottom: 2em; }
  @container (min-width: 11.25em) { #tuner .notes { grid-template-columns: repeat(2, 5.25em); } }
  @container (min-width: 17.25em) { #tuner .notes { grid-template-columns: repeat(3, 5.25em); } }
  @container (min-width: 35.25em) { #tuner .notes { grid-template-columns: repeat(6, 5.25em); } }
  #tuner button { text-transform: none; font-size: 1.5em; width: 100%; padding: 0; }
</style>

<script>
  (function () {
    var ctx, wave;
    var playing = {};
    var a4 = 415;
    // Sixth-comma meantone fifth: 3/2 narrowed by 1/6 of the syntonic comma (81/80).
    var fifth = 1.5 * Math.pow(80 / 81, 1 / 6);
    // The C below middle C. Three fifths up (C3-G3-D4-A4) is A4, so C3 = A4 / fifth^3. All six notes derive from it.
    function lowC() { return a4 / Math.pow(fifth, 3); }

    function start(ratio) {
      ctx = ctx || new AudioContext();
      // Soft, string-like timbre: harmonics falling off as 1/n^2. The overtones make beats easy to hear.
      if (!wave) {
        var real = new Float32Array(9), imag = new Float32Array(9);
        for (var n = 1; n < 9; n++) imag[n] = 1 / (n * n);
        wave = ctx.createPeriodicWave(real, imag);
      }
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.setPeriodicWave(wave);
      osc.frequency.value = lowC() * ratio;
      gain.gain.setValueAtTime(0, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.2, ctx.currentTime + 0.05); // fade in to avoid a click
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      return { osc: osc, gain: gain };
    }

    function stop(voice) {
      var t = ctx.currentTime;
      voice.gain.gain.setValueAtTime(voice.gain.gain.value, t);
      voice.gain.gain.linearRampToValueAtTime(0, t + 0.1);
      voice.osc.stop(t + 0.1);
    }

    document.querySelectorAll('#tuner button').forEach(function (b) {
      b.addEventListener('click', function () {
        var ratio = b.dataset.ratio;
        if (playing[ratio]) {
          stop(playing[ratio]);
          delete playing[ratio];
        } else {
          playing[ratio] = start(+ratio);
        }
        b.classList.toggle('special', !!playing[ratio]);
        b.setAttribute('aria-pressed', !!playing[ratio]);
      });
    });

    document.getElementById('pitch').addEventListener('click', function () {
      a4 = a4 === 415 ? 440 : 415;
      this.textContent = 'A = ' + a4;
      // Retune anything already sounding
      for (var r in playing) playing[r].osc.frequency.value = lowC() * r;
    });
  })();
</script>
